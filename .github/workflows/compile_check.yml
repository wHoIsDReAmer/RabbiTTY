name: Compile Check (Build & Test)

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Cancel superseded runs so stale jobs stop holding the scarce macOS slot.
# The event name is part of the key so a pull request and a push to the same
# branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Rust project - latest
    strategy:
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain:
          - stable
    runs-on: ${{ matrix.os }}
    # Fail fast instead of hanging ~6h when a runner can't be scheduled.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - run: cargo build --locked

      # The plugin tests drive a real component and skip themselves when it is
      # missing, so the guest has to be built or they pass without running.
      - run: rustup target add wasm32-wasip2
      - run: cargo build --locked -p hello --target wasm32-wasip2

      - run: cargo test --locked --workspace
